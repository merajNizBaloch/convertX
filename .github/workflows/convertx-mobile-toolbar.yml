name: ConvertX mobile toolbar

on:
  push:
    paths:
      - ".convertx-mobile-toolbar"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update toolbar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/workspace.tsx')
          s = p.read_text()
          if 'mobileToolsOpen' not in s:
              s = s.replace('  const [splitPage, setSplitPage] = useState(1);', '  const [splitPage, setSplitPage] = useState(1);\n  const [mobileToolsOpen, setMobileToolsOpen] = useState(false);', 1)

          pattern = re.compile(r'\n    <nav className="fixed bottom-3.*?</nav>\n  </main>;', re.S)
          replacement = '''
    <nav className="desktop-tool-dock fixed bottom-3 left-1/2 z-50 -translate-x-1/2 rounded-[26px] border border-white/15 bg-[#1b1e20]/95 px-2 pb-2 pt-2 shadow-2xl shadow-black/60 backdrop-blur-2xl sm:bottom-4">
      <div className="flex max-w-[calc(100vw-20px)] items-end gap-1 overflow-visible px-1 pt-1 scrollbar-none">
        {grouped.flatMap(g=>g.items).map(t=>{const Active=t.id===toolId; return <button key={t.id} onClick={()=>selectTool(t.id)} aria-label={t.title} className="dock-item group relative flex w-[68px] shrink-0 flex-col items-center justify-end gap-1 rounded-2xl p-1.5 text-white/50">
          <span className={`grid h-11 w-11 place-items-center rounded-[15px] border shadow-lg transition ${Active ? "scale-105 border-white/30" : "border-white/10"}`} style={{color:t.color, backgroundColor:t.tint, boxShadow:Active ? `0 8px 24px ${t.color}35` : undefined}}><t.icon size={20} strokeWidth={2.2}/></span>
          <span className={`dock-label pointer-events-none max-w-[66px] truncate text-center text-[8px] font-bold leading-3 tracking-tight text-white ${Active ? "opacity-100 translate-y-0" : "opacity-75"}`}>{t.title}</span>
        </button>})}
      </div>
    </nav>

    <div className="mobile-tool-launcher">
      {mobileToolsOpen && <button aria-label="Close tools" className="mobile-tool-backdrop" onClick={()=>setMobileToolsOpen(false)} />}
      {mobileToolsOpen && <div className="mobile-tool-panel">
        <div className="mobile-tool-panel-title">Choose a tool</div>
        <div className="mobile-tool-grid">
          {tools.map(t=>{const Active=t.id===toolId; return <button key={t.id} onClick={()=>{selectTool(t.id);setMobileToolsOpen(false)}} aria-label={t.title} className={`mobile-tool-button ${Active ? "is-active" : ""}`}>
            <span className="mobile-tool-icon" style={{color:t.color,backgroundColor:t.tint}}><t.icon size={20} strokeWidth={2.2}/></span>
            <span className="mobile-tool-name">{t.title}</span>
          </button>})}
        </div>
      </div>}
      <button type="button" aria-expanded={mobileToolsOpen} aria-label={mobileToolsOpen ? "Close tools" : "Open tools"} onClick={()=>setMobileToolsOpen(v=>!v)} className="mobile-tool-toggle"><span></span><span></span><span></span></button>
    </div>
  </main>;'''
          if not pattern.search(s):
              raise SystemExit('Toolbar markup not found')
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          c += '''

.mobile-tool-launcher { display: none; }
@media (max-width: 700px) {
  .desktop-tool-dock { display: none !important; }
  .mobile-tool-launcher { display: block; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 100; }
  .mobile-tool-toggle { width: 56px; height: 56px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: rgba(27,30,32,.98); box-shadow: 0 14px 34px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:#f4f1e8; }
  .mobile-tool-toggle span { width:22px; height:2px; border-radius:99px; background:currentColor; transition:transform .18s ease,opacity .18s ease; }
  .mobile-tool-launcher:has(.mobile-tool-panel) .mobile-tool-toggle span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .mobile-tool-launcher:has(.mobile-tool-panel) .mobile-tool-toggle span:nth-child(2) { opacity:0; }
  .mobile-tool-launcher:has(.mobile-tool-panel) .mobile-tool-toggle span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  .mobile-tool-backdrop { position:fixed; inset:0; border:0; background:rgba(0,0,0,.32); backdrop-filter:blur(2px); }
  .mobile-tool-panel { position:fixed; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); width:min(320px,calc(100vw - 24px)); max-height:min(70vh,520px); overflow-y:auto; padding:14px; border:1px solid rgba(255,255,255,.13); border-radius:22px; background:rgba(24,27,29,.99); box-shadow:0 24px 70px rgba(0,0,0,.6); backdrop-filter:blur(20px); }
  .mobile-tool-panel-title { margin:2px 4px 12px; font-size:10px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.42); }
  .mobile-tool-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .mobile-tool-button { min-width:0; display:flex; align-items:center; gap:9px; padding:9px; border:1px solid rgba(255,255,255,.08); border-radius:14px; background:rgba(255,255,255,.025); color:#fff; text-align:left; }
  .mobile-tool-button.is-active { border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.07); }
  .mobile-tool-icon { display:grid; width:38px; height:38px; min-width:38px; place-items:center; border:1px solid rgba(255,255,255,.1); border-radius:12px; }
  .mobile-tool-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:800; }
  body { padding-bottom:88px; }
}
'''
          css.write_text(c)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .convertx-mobile-toolbar
          git add app/workspace.tsx app/globals.css .convertx-mobile-toolbar
          git commit -m "fix: add mobile hamburger tool menu"
          git push

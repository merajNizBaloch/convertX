name: Update ConvertX upload restrictions

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply restrictions
        run: |
          if [ ! -f .convertx-upload-restrictions ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/workspace.tsx')
          s=p.read_text()
          if 'const MAX_IMAGE_SIZE' not in s:
              s=s.replace('  const [mobileToolsOpen, setMobileToolsOpen] = useState(false);', '  const [mobileToolsOpen, setMobileToolsOpen] = useState(false);\n  const MAX_IMAGE_SIZE = 20 * 1024 * 1024;\n  const MAX_PDF_SIZE = 40 * 1024 * 1024;\n  const MAX_BATCH_SIZE = 80 * 1024 * 1024;', 1)
          old='''  function accepts(file: File) {\n    if (tool.group === "PDF") return toolId === "image-pdf" ? file.type.startsWith("image/") : file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");\n    return file.type.startsWith("image/");\n  }\n  function addFiles(list: FileList | File[]) {\n    const picked = Array.from(list).filter(accepts);\n    if (!picked.length) { setError(`This bench accepts ${tool.from} material.`); return; }\n    setError(""); setOutputs([]); setProgress(0); setFiles(prev => toolId === "split" ? picked.slice(0, 1) : [...prev, ...picked]);\n  }'''
          new='''  function acceptedTypes() {\n    switch (toolId) {\n      case "png-jpg": return { label: "PNG", accept: "image/png,.png" };\n      case "jpg-png": return { label: "JPG / JPEG", accept: "image/jpeg,.jpg,.jpeg" };\n      case "webp-jpg": return { label: "WEBP", accept: "image/webp,.webp" };\n      case "jpg-webp": return { label: "JPG / JPEG", accept: "image/jpeg,.jpg,.jpeg" };\n      case "image-pdf": return { label: "PNG / JPG / JPEG / WEBP", accept: "image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" };\n      case "pdf-image":\n      case "merge":\n      case "split": return { label: "PDF", accept: ".pdf,application/pdf" };\n      case "compress":\n      case "resize": return { label: "Image", accept: "image/*" };\n    }\n  }\n  function maxFileSize() { return tool.group === "PDF" && toolId !== "image-pdf" ? MAX_PDF_SIZE : MAX_IMAGE_SIZE; }\n  function accepts(file: File) {\n    const name = file.name.toLowerCase();\n    if (toolId === "png-jpg") return file.type === "image/png" || name.endsWith(".png");\n    if (toolId === "jpg-png" || toolId === "jpg-webp") return file.type === "image/jpeg" || name.endsWith(".jpg") || name.endsWith(".jpeg");\n    if (toolId === "webp-jpg") return file.type === "image/webp" || name.endsWith(".webp");\n    if (toolId === "image-pdf") return [".png", ".jpg", ".jpeg", ".webp"].some(ext => name.endsWith(ext)) || ["image/png", "image/jpeg", "image/webp"].includes(file.type);\n    if (toolId === "compress" || toolId === "resize") return file.type.startsWith("image/");\n    return file.type === "application/pdf" || name.endsWith(".pdf");\n  }\n  function addFiles(list: FileList | File[]) {\n    const incoming = Array.from(list);\n    const invalid = incoming.find(file => !accepts(file));\n    if (invalid) { setError(`${invalid.name} is not a supported ${acceptedTypes().label} file for this tool.`); return; }\n    const limit = maxFileSize();\n    const tooLarge = incoming.find(file => file.size > limit);\n    if (tooLarge) { setError(`${tooLarge.name} is too large. Maximum allowed is ${bytes(limit)} per file.`); return; }\n    const currentSize = files.reduce((sum, file) => sum + file.size, 0);\n    const incomingSize = incoming.reduce((sum, file) => sum + file.size, 0);\n    if (currentSize + incomingSize > MAX_BATCH_SIZE) { setError(`The total upload limit is ${bytes(MAX_BATCH_SIZE)}. Remove some files before adding more.`); return; }\n    setError(""); setOutputs([]); setProgress(0); setFiles(prev => toolId === "split" ? incoming.slice(0, 1) : [...prev, ...incoming]);\n  }'''
          if old not in s: raise SystemExit('restriction block not found')
          s=s.replace(old,new,1)
          s=s.replace('accept={tool.group === "PDF" && toolId !== "image-pdf" ? ".pdf,application/pdf" : "image/*"}', 'accept={acceptedTypes().accept}', 1)
          anchor='<p className="mt-2 text-sm text-white/40">or click anywhere to load files from this device</p>'
          info='<p className="mt-2 text-sm text-white/40">or click anywhere to load files from this device</p><div className="mt-4 text-[10px] font-bold uppercase tracking-[.12em] text-white/25">Accepted: {acceptedTypes().label} · Max {bytes(maxFileSize())} per file · {bytes(MAX_BATCH_SIZE)} total</div>'
          if anchor not in s: raise SystemExit('upload info anchor not found')
          s=s.replace(anchor,info,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .convertx-upload-restrictions .github/workflows/update-restrictions.yml
          git add app/workspace.tsx app/globals.css .convertx-upload-restrictions .github/workflows/update-restrictions.yml
          git commit -m "feat: enforce upload type and size limits"
          git push
